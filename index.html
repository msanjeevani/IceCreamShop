                            setCustomQty(Math.max(1, customQty - 1))
                          }
                        >
                          −
                        </button>

                        <input
                          className="form-control text-center"
                          value={customQty}
                          readOnly
                        />

                        <button
                          className="btn btn-outline-secondary"
                          onClick={() => setCustomQty(customQty + 1)}
                        >
                          +
                        </button>
                      </div>
                    </div>

                    <div className="modal-footer">
                      <button
                        className="btn btn-light"
                        onClick={() => setCustomOpen(false)}
                      >
                        Cancel
                      </button>

                      <button
                        className="btn btn-danger rounded-pill"
                        onClick={() => {
                          const sizeExtra =
                            customSize === "Small"
                              ? 0
                              : customSize === "Regular"
                                ? 20
                                : 40;

                          const toppingExtra = topping === "None" ? 0 : 30;

                          addToCart(selected, {
                            qty: customQty,
                            size: customSize,
                            topping,
                            extra: sizeExtra + toppingExtra,
                          });
                        }}
                      >
                        Add to Cart
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PAYMENT MODAL */}

            {showPayment && (
              <div
                className="modal d-block"
                style={{
                  background: "#0009",
                  zIndex: 5000,
                }}
              >
                <div className="modal-dialog modal-dialog-centered">
                  <div className="modal-content rounded-4">
                    <div className="modal-header">
                      <h5 className="fw-bold">💳 Secure Checkout</h5>

                      <button
                        className="btn-close"
                        onClick={() => setShowPayment(false)}
                      ></button>
                    </div>

                    <div className="modal-body">
                      <div className="alert alert-info small">
                        🛡️ Demo payment environment. No real money will be
                        charged.
                      </div>

                      <h6 className="fw-bold">Choose Payment</h6>

                      <div className="row g-2 mt-2">
                        {[
                          ["GPay", "📱"],
                          ["UPI", "⚡"],
                          ["Credit Card", "💳"],
                          ["Cash", "💵"],
                        ].map((x) => (
                          <div className="col-6" key={x[0]}>
                            <div
                              className={
                                payment === x[0]
                                  ? "payment-option selected"
                                  : "payment-option"
                              }
                              onClick={() => setPayment(x[0])}
                            >
                              <div className="fs-3">{x[1]}</div>

                              <strong>{x[0]}</strong>
                            </div>
                          </div>
                        ))}
                      </div>

                      <hr />

                      <div className="d-flex justify-content-between">
                        <strong>Payable Amount</strong>

                        <strong>₹{total}</strong>
                      </div>
                    </div>

                    <div className="modal-footer">
                      <button
                        className="btn btn-light"
                        onClick={() => setShowPayment(false)}
                      >
                        Cancel
                      </button>

                      <button
                        className="btn btn-danger rounded-pill px-4"
                        onClick={placeOrder}
                      >
                        Pay ₹{total}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* RECEIPT */}

            {showReceipt && order && (
              <div
                className="modal d-block"
                style={{
                  background: "#0009",
                  zIndex: 5000,
                }}
              >
                <div className="modal-dialog modal-dialog-centered">
                  <div className="modal-content rounded-4">
                    <div className="modal-header">
                      <h5 className="fw-bold">🧾 FrostBite Receipt</h5>

                      <button
                        className="btn-close"
                        onClick={() => setShowReceipt(false)}
                      ></button>
                    </div>

                    <div className="modal-body">
                      <div className="receipt">
                        <div className="text-center">
                          <div className="fs-1">🍦</div>

                          <h4 className="fw-bold">FrostBite</h4>

                          <p className="text-secondary">Digital Receipt</p>
                        </div>

                        <hr />

                        <p>
                          <strong>Order:</strong> #{order.id}
                        </p>

                        <p>
                          <strong>Date:</strong> {order.date}
                        </p>

                        <p>
                          <strong>Payment:</strong> {order.payment}
                        </p>

                        <hr />

                        {order.items.map((x, i) => (
                          <div
                            className="d-flex justify-content-between"
                            key={i}
                          >
                            <span>
                              {x.name} × {x.qty}
                            </span>

                            <span>₹{(x.price + x.extra) * x.qty}</span>
                          </div>
                        ))}

                        <hr />

                        <div className="d-flex justify-content-between">
                          <span>Subtotal</span>
                          <span>₹{order.subtotal}</span>
                        </div>

                        <div className="d-flex justify-content-between">
                          <span>Tax</span>
                          <span>₹{order.tax}</span>
                        </div>

                        <div className="d-flex justify-content-between text-success">
                          <span>Discount</span>
                          <span>−₹{order.discount}</span>
                        </div>

                        <hr />

                        <div className="d-flex justify-content-between fs-5">
                          <strong>Total</strong>
                          <strong>₹{order.total}</strong>
                        </div>

                        <div className="text-center mt-4">
                          <p className="mb-0">
                            Thank you for choosing FrostBite ❤️
                          </p>
                          <small className="text-secondary">
                            Enjoy every scoop!
                          </small>
                        </div>
                      </div>
                    </div>

                    <div className="modal-footer">
                      <button
                        className="btn btn-danger rounded-pill"
                        onClick={() => {
                          window.print();
                        }}
                      >
                        🖨️ Print Receipt
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* FOOTER */}

            <footer className="bg-dark text-white py-5">
              <div className="container">
                <div className="row">
                  <div className="col-md-6">
                    <h3 className="fw-bold">🍦 FrostBite</h3>

                    <p className="text-secondary">
                      Smart real-time ice cream ordering experience.
                    </p>
                  </div>

                  <div className="col-md-6 text-md-end">
                    <p className="text-secondary">Built with</p>

                    <strong>
                      React.js • Bootstrap • Tailwind CSS • Leaflet
                    </strong>

                    <p className="text-secondary mt-2">© 2026 FrostBite</p>
                  </div>
                </div>
              </div>
            </footer>

            {/* TOAST */}

            {toast && (
              <div className="toast-box">
                <div className="bg-dark text-white rounded-pill px-4 py-3 shadow-lg">
                  {toast}
                </div>
              </div>
            )}
          </>
        );
      }

      /* =====================================================
   START
===================================================== */

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
