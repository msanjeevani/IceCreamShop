<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#f43f5e" />
    <title>FrostBite | Smart Ice Cream Experience</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #fffaf7;
        color: #292524;
        transition: 0.3s;
      }
      body.dark {
        background: #09090b;
        color: #f5f5f5;
      }
      :root {
        --pink: #f43f5e;
        --pink2: #fb7185;
        --orange: #f97316;
        --cream: #fff7ed;
        --dark: #18181b;
      }
      .navbar {
        background: rgba(255, 255, 255, 0.92) !important;
        backdrop-filter: blur(18px);
        border-bottom: 1px solid #eee;
      }
      body.dark .navbar {
        background: rgba(24, 24, 27, 0.95) !important;
      }
      body.dark .navbar .nav-link {
        color: #fff;
      }
      body.dark .navbar-toggler {
        filter: invert(1);
      }
      .brand {
        font-weight: 900;
        color: var(--pink) !important;
        font-size: 1.55rem;
      }
      .hero {
        min-height: 720px;
        display: flex;
        align-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 10% 20%, #ffe4e6 0, transparent 30%),
          radial-gradient(circle at 90% 20%, #ffedd5 0, transparent 30%),
          linear-gradient(135deg, #fff7ed, #fff1f2);
      }
      body.dark .hero {
        background:
          radial-gradient(circle at 10% 20%, #3f172a 0, transparent 30%),
          radial-gradient(circle at 90% 20%, #431407 0, transparent 30%),
          #09090b;
      }
      .hero-title {
        font-size: clamp(3rem, 7vw, 6.5rem);
        line-height: 0.94;
        font-weight: 950;
        letter-spacing: -5px;
      }
      .gradient-text {
        background: linear-gradient(90deg, #f43f5e, #fb7185, #f97316);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hero-card {
        border-radius: 40px;
        padding: 35px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 30px 90px rgba(244, 63, 94, 0.18);
        animation: float 4s ease-in-out infinite;
      }
      body.dark .hero-card {
        background: #18181bcc;
      }
      .hero-ice {
        font-size: 12rem;
        text-align: center;
        filter: drop-shadow(0 25px 25px #0002);
      }
      @keyframes float {
        50% {
          transform: translateY(-15px) rotate(-2deg);
        }
      }
      .section {
        padding: 90px 0;
      }
      body.dark .section.bg-light {
        background: #111113 !important;
      }
      .glass {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #fff;
        box-shadow: 0 15px 45px #00000010;
        backdrop-filter: blur(15px);
      }
      body.dark .glass {
        background: #18181bcc;
        border-color: #27272a;
      }
      body.dark .text-secondary {
        color: #a1a1aa !important;
      }
      .shop-card,
      .menu-card,
      .feature-card {
        background: #fff;
        border: 0;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 12px 35px #0000000d;
        transition: 0.3s;
      }
      body.dark .shop-card,
      body.dark .menu-card,
      body.dark .feature-card {
        background: #18181b;
        color: white;
      }
      .shop-card:hover,
      .menu-card:hover,
      .feature-card:hover {
        transform: translateY(-7px);
        box-shadow: 0 22px 50px #f43f5e22;
      }
      .menu-image {
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 7rem;
        background: linear-gradient(135deg, #fff1f2, #ffedd5);
      }
      body.dark .menu-image {
        background: linear-gradient(135deg, #3f172a, #431407);
      }
      .category-btn {
        border: 1px solid #e7e5e4;
        background: white;
        border-radius: 999px;
        padding: 9px 18px;
        transition: 0.2s;
      }
      body.dark .category-btn {
        background: #18181b;
        color: white;
        border-color: #3f3f46;
      }
      .category-btn.active,
      .category-btn:hover {
        background: var(--pink);
        color: #fff;
        border-color: var(--pink);
      }
      #map {
        height: 440px;
        border-radius: 25px;
        z-index: 1;
      }
      .movement-bar {
        height: 12px;
        border-radius: 50px;
        background: #e7e5e4;
        overflow: hidden;
      }
      .movement-progress {
        height: 100%;
        background: linear-gradient(90deg, #f43f5e, #fb7185);
        transition: width 0.4s;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        background: #22c55e;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        70% {
          box-shadow: 0 0 0 12px #22c55e00;
        }
      }
      .floating-cart {
        position: fixed;
        right: 25px;
        bottom: 25px;
        width: 65px;
        height: 65px;
        border: 0;
        border-radius: 50%;
        background: #f43f5e;
        color: white;
        z-index: 2000;
        box-shadow: 0 15px 35px #f43f5e55;
      }
      .cart-count {
        position: absolute;
        right: -3px;
        top: -4px;
        width: 24px;
        height: 24px;
        background: #18181b;
        color: white;
        border-radius: 50%;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cart-panel {
        position: fixed;
        right: 20px;
        bottom: 100px;
        width: min(430px, calc(100% - 40px));
        max-height: 75vh;
        overflow: auto;
        z-index: 1900;
        display: none;
        border-radius: 25px;
      }
      .cart-panel.show {
        display: block;
        animation: slide 0.3s;
      }
      @keyframes slide {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .payment-option {
        border: 2px solid #e7e5e4;
        border-radius: 15px;
        padding: 15px;
        cursor: pointer;
        transition: 0.2s;
      }
      .payment-option.selected {
        border-color: #f43f5e;
        background: #fff1f2;
      }
      body.dark .payment-option {
        border-color: #3f3f46;
      }
      body.dark .payment-option.selected {
        background: #3f172a;
      }
      .favorite {
        cursor: pointer;
        font-size: 1.35rem;
      }
      .favorite.active {
        color: #ef4444;
      }
      .admin {
        background: #18181b;
        color: white;
        border-radius: 30px;
      }
      .admin input,
      .admin select {
        background: #27272a;
        border-color: #3f3f46;
        color: white;
      }
      .timeline {
        position: relative;
        padding-left: 35px;
      }
      .timeline:before {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #fecdd3;
      }
      .timeline-item {
        position: relative;
        margin-bottom: 25px;
      }
      .timeline-item:before {
        content: "";
        position: absolute;
        left: -31px;
        top: 4px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #f43f5e;
        border: 3px solid #ffe4e6;
      }
      .ai-box {
        background: linear-gradient(135deg, #fff1f2, #ffedd5);
        border-radius: 30px;
      }
      body.dark .ai-box {
        background: linear-gradient(135deg, #3f172a, #431407);
      }
      .stat {
        border-radius: 22px;
        padding: 25px;
        background: white;
        box-shadow: 0 10px 30px #0000000b;
      }
      body.dark .stat {
        background: #18181b;
      }
      .badge-live {
        background: #dcfce7;
        color: #166534;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 800;
      }
      .toast-box {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 6000;
      }
      .receipt {
        background: white;
        border-radius: 20px;
        padding: 25px;
      }
      body.dark .receipt {
        background: #18181b;
      }
      .empty {
        padding: 50px 20px;
        text-align: center;
        color: #71717a;
      }
      @media (max-width: 768px) {
        .hero {
          min-height: auto;
          padding: 90px 0;
        }
        .hero-card {
          margin-top: 50px;
        }
        .hero-ice {
          font-size: 8rem;
        }
        .section {
          padding: 60px 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- React -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      /* =====================================================
   DEFAULT DATA
===================================================== */

      const DEFAULT_MENU = [
        {
          id: 1,
          name: "Classic Vanilla",
          category: "Classic",
          price: 90,
          emoji: "🍦",
          rating: 4.8,
          stock: 20,
          seasonal: false,
          newItem: false,
          description: "Smooth and creamy vanilla ice cream.",
        },
        {
          id: 2,
          name: "Chocolate Dream",
          category: "Chocolate",
          price: 120,
          emoji: "🍫",
          rating: 4.9,
          stock: 15,
          seasonal: false,
          newItem: false,
          description: "Rich Belgian chocolate flavour.",
        },
        {
          id: 3,
          name: "Strawberry Bliss",
          category: "Fruit",
          price: 110,
          emoji: "🍓",
          rating: 4.7,
          stock: 12,
          seasonal: true,
          newItem: false,
          description: "Fresh strawberry ice cream.",
        },
        {
          id: 4,
          name: "Mango Magic",
          category: "Fruit",
          price: 130,
          emoji: "🥭",
          rating: 4.9,
          stock: 18,
          seasonal: true,
          newItem: false,
          description: "Seasonal Alphonso mango flavour.",
        },
        {
          id: 5,
          name: "Butterscotch Crunch",
          category: "Special",
          price: 140,
          emoji: "🍨",
          rating: 4.8,
          stock: 10,
          seasonal: false,
          newItem: false,
          description: "Butterscotch with crunchy caramel.",
        },
        {
          id: 6,
          name: "Pista Royal",
          category: "Special",
          price: 150,
          emoji: "💚",
          rating: 4.6,
          stock: 8,
          seasonal: false,
          newItem: false,
          description: "Premium roasted pistachio flavour.",
        },
        {
          id: 7,
          name: "Cookies & Cream",
          category: "Chocolate",
          price: 135,
          emoji: "🍪",
          rating: 4.9,
          stock: 14,
          seasonal: false,
          newItem: true,
          description: "Creamy ice cream with cookie chunks.",
        },
        {
          id: 8,
          name: "Blueberry Cheesecake",
          category: "Special",
          price: 160,
          emoji: "🫐",
          rating: 4.9,
          stock: 7,
          seasonal: false,
          newItem: true,
          description: "Premium blueberry cheesecake.",
        },
        {
          id: 9,
          name: "Tender Coconut",
          category: "Fruit",
          price: 125,
          emoji: "🥥",
          rating: 4.7,
          stock: 11,
          seasonal: true,
          newItem: true,
          description: "Refreshing tender coconut flavour.",
        },
        {
          id: 10,
          name: "Caramel Fudge",
          category: "Chocolate",
          price: 145,
          emoji: "🍮",
          rating: 4.8,
          stock: 9,
          seasonal: false,
          newItem: true,
          description: "Caramel ice cream with fudge.",
        },
      ];

      const SHOP = {
        lat: 8.7139,
        lng: 77.7567,
        name: "FrostBite Ice Cream Studio",
        address: "Main Road, Tirunelveli",
      };

      const coupons = {
        FROST10: { type: "percent", value: 10, min: 200 },
        SWEET50: { type: "flat", value: 50, min: 400 },
        WELCOME: { type: "percent", value: 15, min: 500 },
      };

      /* =====================================================
   APP
===================================================== */

      function App() {
        const [menu, setMenu] = useState(() => {
          const saved = localStorage.getItem("frostbite_menu");
          return saved ? JSON.parse(saved) : DEFAULT_MENU;
        });

        const [cart, setCart] = useState([]);
        const [favorites, setFavorites] = useState(() => {
          return JSON.parse(
            localStorage.getItem("frostbite_favorites") || "[]",
          );
        });
        const [orders, setOrders] = useState(() => {
          return JSON.parse(localStorage.getItem("frostbite_orders") || "[]");
        });

        const [dark, setDark] = useState(() => {
          return localStorage.getItem("frostbite_dark") === "true";
        });

        const [search, setSearch] = useState("");
        const [category, setCategory] = useState("All");
        const [showCart, setShowCart] = useState(false);
        const [showPayment, setShowPayment] = useState(false);
        const [showReceipt, setShowReceipt] = useState(false);
        const [admin, setAdmin] = useState(false);
        const [payment, setPayment] = useState("GPay");
        const [coupon, setCoupon] = useState("");
        const [discount, setDiscount] = useState(0);
        const [toast, setToast] = useState("");
        const [journey, setJourney] = useState(false);
        const [movement, setMovement] = useState(0);
        const [travelMode, setTravelMode] = useState("walking");
        const [location, setLocation] = useState(null);
        const [order, setOrder] = useState(null);
        const [orderStatus, setOrderStatus] = useState("");
        const [recommendation, setRecommendation] = useState("Chocolate Dream");
        const [review, setReview] = useState(0);
        const [reviewText, setReviewText] = useState("");
        const [selected, setSelected] = useState(null);
        const [customSize, setCustomSize] = useState("Regular");
        const [topping, setTopping] = useState("None");
        const [customQty, setCustomQty] = useState(1);
        const [customOpen, setCustomOpen] = useState(false);
        const [adminTab, setAdminTab] = useState("menu");
        const [notifications, setNotifications] = useState([]);
        const [showNotifications, setShowNotifications] = useState(false);

        const mapRef = useRef(null);
        const leafletMap = useRef(null);
        const userMarker = useRef(null);

        /* =====================================================
   PERSISTENCE
===================================================== */

        useEffect(() => {
          localStorage.setItem("frostbite_menu", JSON.stringify(menu));
        }, [menu]);

        useEffect(() => {
          localStorage.setItem(
            "frostbite_favorites",
            JSON.stringify(favorites),
          );
        }, [favorites]);

        useEffect(() => {
          localStorage.setItem("frostbite_orders", JSON.stringify(orders));
        }, [orders]);

        useEffect(() => {
          localStorage.setItem("frostbite_dark", dark);
          document.body.classList.toggle("dark", dark);
        }, [dark]);

        /* =====================================================
   TOAST / NOTIFICATION
===================================================== */

        const notify = (msg) => {
          setToast(msg);
          setNotifications((n) =>
            [
              {
                message: msg,
                time: new Date().toLocaleTimeString(),
                id: Date.now(),
              },
              ...n,
            ].slice(0, 10),
          );

          setTimeout(() => setToast(""), 2800);
        };

        /* =====================================================
   CART
===================================================== */

        const addToCart = (item, custom = null) => {
          const qty = custom?.qty || 1;

          const existing = cart.find(
            (x) =>
              x.id === item.id &&
              x.size === (custom?.size || "Regular") &&
              x.topping === (custom?.topping || "None"),
          );

          if (existing) {
            setCart(
              cart.map((x) =>
                x === existing ? { ...x, qty: x.qty + qty } : x,
              ),
            );
          } else {
            setCart([
              ...cart,
              {
                ...item,
                qty,
                size: custom?.size || "Regular",
                topping: custom?.topping || "None",
                extra: custom?.extra || 0,
              },
            ]);
          }

          notify(item.name + " added to cart 🍦");
          setCustomOpen(false);
        };

        const changeQty = (index, amount) => {
          setCart(
            cart
              .map((x, i) => (i === index ? { ...x, qty: x.qty + amount } : x))
              .filter((x) => x.qty > 0),
          );
        };

        const cartCount = cart.reduce((s, x) => s + x.qty, 0);

        const subtotal = cart.reduce(
          (s, x) => s + x.price * x.qty + x.extra * x.qty,
          0,
        );

        const tax = Math.round(subtotal * 0.05);

        const couponDiscount = discount;

        const total = Math.max(0, subtotal + tax - couponDiscount);

        /* =====================================================
   COUPON
===================================================== */

        const applyCoupon = () => {
          const code = coupon.trim().toUpperCase();
          const data = coupons[code];

          if (!data) {
            notify("Invalid coupon code ❌");
            setDiscount(0);
            return;
          }

          if (subtotal < data.min) {
            notify(`Minimum order ₹${data.min} required`);
            return;
          }

          let amount = 0;

          if (data.type === "percent") {
            amount = Math.round((subtotal * data.value) / 100);
          } else {
            amount = data.value;
          }

          setDiscount(amount);
          notify(`Coupon applied! You saved ₹${amount} 🎁`);
        };

        /* =====================================================
   FAVORITES
===================================================== */

        const toggleFavorite = (id) => {
          setFavorites(
            favorites.includes(id)
              ? favorites.filter((x) => x !== id)
              : [...favorites, id],
          );
        };

        /* =====================================================
   FILTER
===================================================== */

        const filtered = useMemo(() => {
          return menu.filter((item) => {
            const cat = category === "All" || item.category === category;

            const text = item.name.toLowerCase().includes(search.toLowerCase());

            return cat && text && item.stock > 0;
          });
        }, [menu, category, search]);

        /* =====================================================
   AI RECOMMENDATION
===================================================== */

        const aiRecommend = (type) => {
          let result;

          if (type === "chocolate")
            result = menu.find((x) => x.category === "Chocolate");
          else if (type === "budget")
            result = menu
              .filter((x) => x.price <= 150)
              .sort((a, b) => b.rating - a.rating)[0];
          else if (type === "best")
            result = [...menu].sort((a, b) => b.rating - a.rating)[0];
          else if (type === "fruit")
            result = menu.find((x) => x.category === "Fruit");
          else result = menu.find((x) => x.newItem) || menu[0];

          if (result) {
            setRecommendation(result.name);
            document
              .getElementById("menu")
              ?.scrollIntoView({ behavior: "smooth" });
            notify(`AI recommends ${result.name} 🤖`);
          }
        };

        /* =====================================================
   GPS
===================================================== */

        const getLocation = () => {
          if (!navigator.geolocation) {
            notify("GPS not supported. Demo mode activated.");
            startDemoLocation();
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const loc = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              };

              setLocation(loc);
              initMap(loc);
              notify("Live GPS location detected 📍");
            },
            () => {
              startDemoLocation();
              notify("GPS permission unavailable. Demo location used.");
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
            },
          );
        };

        const startDemoLocation = () => {
          const demo = { lat: 8.705, lng: 77.745 };
          setLocation(demo);
          setTimeout(() => initMap(demo), 100);
        };

        /* =====================================================
   MAP
===================================================== */

        const initMap = (loc) => {
          if (!mapRef.current) return;

          if (leafletMap.current) {
            leafletMap.current.remove();
            leafletMap.current = null;
          }

          const m = L.map(mapRef.current).setView([loc.lat, loc.lng], 14);

          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap",
          }).addTo(m);

          L.marker([SHOP.lat, SHOP.lng])
            .addTo(m)
            .bindPopup(`<b>🍦 ${SHOP.name}</b><br>${SHOP.address}`);

          userMarker.current = L.marker([loc.lat, loc.lng])
            .addTo(m)
            .bindPopup("📍 Your Location");

          L.polyline(
            [
              [loc.lat, loc.lng],
              [SHOP.lat, SHOP.lng],
            ],
            {
              dashArray: "8,10",
            },
          ).addTo(m);

          leafletMap.current = m;
        };

        /* =====================================================
   JOURNEY
===================================================== */

        const startJourney = () => {
          setJourney(true);
          setMovement(0);
          getLocation();

          setTimeout(() => {
            document
              .getElementById("journey")
              ?.scrollIntoView({ behavior: "smooth" });
          }, 200);

          notify("Your journey has started 🚀");
        };

        useEffect(() => {
          if (!journey) return;

          const speed =
            travelMode === "walking"
              ? 400
              : travelMode === "cycling"
                ? 300
                : 180;

          const timer = setInterval(() => {
            setMovement((prev) => {
              if (prev >= 100) {
                clearInterval(timer);
                notify("You reached FrostBite! 🎉");
                return 100;
              }

              return prev + 1;
            });
          }, speed);

          return () => clearInterval(timer);
        }, [journey, travelMode]);

        /* =====================================================
   DISTANCE / ETA
===================================================== */

        const distance = location
          ? Math.max(
              0.2,
              Math.sqrt(
                Math.pow((SHOP.lat - location.lat) * 111, 2) +
                  Math.pow(
                    (SHOP.lng - location.lng) *
                      111 *
                      Math.cos((location.lat * Math.PI) / 180),
                    2,
                  ),
              ),
            )
          : 2.4;

        const eta =
          travelMode === "walking"
            ? Math.ceil((distance / 5) * 60)
            : travelMode === "cycling"
              ? Math.ceil((distance / 15) * 60)
              : Math.ceil((distance / 30) * 60);

        /* =====================================================
   CHECKOUT
===================================================== */

        const placeOrder = () => {
          if (!cart.length) {
            notify("Cart is empty.");
            return;
          }

          const newOrder = {
            id: "FB" + Math.floor(100000 + Math.random() * 900000),
            items: [...cart],
            subtotal,
            tax,
            discount: couponDiscount,
            total,
            payment,
            status: "Order Confirmed",
            date: new Date().toLocaleString(),
          };

          setOrder(newOrder);
          setOrders([newOrder, ...orders]);
          setCart([]);
          setDiscount(0);
          setCoupon("");
          setShowPayment(false);
          setShowCart(false);
          setOrderStatus("Order Confirmed");
          notify("Order placed successfully 🎉");

          setTimeout(() => {
            document
              .getElementById("tracking")
              ?.scrollIntoView({ behavior: "smooth" });
          }, 500);
        };

        /* =====================================================
   ORDER STATUS
===================================================== */

        useEffect(() => {
          if (!order) return;

          const statuses = [
            "Order Confirmed",
            "Preparing",
            "Scooping",
            "Packed",
            "Ready for Pickup",
          ];

          let index = 0;

          const timer = setInterval(() => {
            index++;

            if (index < statuses.length) {
              setOrderStatus(statuses[index]);

              setOrder((o) => (o ? { ...o, status: statuses[index] } : o));

              notify(statuses[index]);
            } else {
              clearInterval(timer);
            }
          }, 5000);

          return () => clearInterval(timer);
        }, [order?.id]);

        /* =====================================================
   ADMIN
===================================================== */

        const toggleStock = (id) => {
          setMenu(
            menu.map((item) =>
              item.id === id
                ? { ...item, stock: item.stock > 0 ? 0 : 10 }
                : item,
            ),
          );

          notify("Stock updated live ⚡");
        };

        const deleteItem = (id) => {
          setMenu(menu.filter((x) => x.id !== id));
          notify("Menu item removed.");
        };

        const addItem = () => {
          const name = document.getElementById("aName").value;
          const price = Number(document.getElementById("aPrice").value);
          const emoji = document.getElementById("aEmoji").value || "🍨";
          const cat = document.getElementById("aCat").value;
          const stock = Number(document.getElementById("aStock").value) || 10;

          if (!name || !price) {
            notify("Enter item name and price.");
            return;
          }

          setMenu([
            ...menu,
            {
              id: Date.now(),
              name,
              price,
              emoji,
              category: cat,
              stock,
              rating: 4.5,
              seasonal: false,
              newItem: true,
              description: "Freshly added FrostBite flavour.",
            },
          ]);

          ["aName", "aPrice", "aEmoji", "aStock"].forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.value = "";
          });

          notify("New flavour added live 🍦");
        };

        /* =====================================================
   STATS
===================================================== */

        const revenue = orders.reduce((s, o) => s + o.total, 0);

        const soldItems = orders
          .flatMap((o) => o.items)
          .reduce((s, x) => s + x.qty, 0);

        const bestSeller = orders
          .flatMap((o) => o.items)
          .reduce((acc, item) => {
            acc[item.name] = (acc[item.name] || 0) + item.qty;
            return acc;
          }, {});

        const bestName =
          Object.keys(bestSeller).sort(
            (a, b) => bestSeller[b] - bestSeller[a],
          )[0] || "No orders yet";

        /* =====================================================
   RENDER
===================================================== */

        return (
          <>
            {/* NAVBAR */}

            <nav className="navbar navbar-expand-lg sticky-top">
              <div className="container">
                <a href="#home" className="navbar-brand brand">
                  🍦 FrostBite
                </a>

                <button
                  className="navbar-toggler"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbar"
                >
                  <span className="navbar-toggler-icon"></span>
                </button>

                <div className="collapse navbar-collapse" id="navbar">
                  <ul className="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li className="nav-item">
                      <a className="nav-link" href="#home">
                        Home
                      </a>
                    </li>

                    <li className="nav-item">
                      <a className="nav-link" href="#journey">
                        Journey
                      </a>
                    </li>

                    <li className="nav-item">
                      <a className="nav-link" href="#menu">
                        Menu
                      </a>
                    </li>

                    <li className="nav-item">
                      <a className="nav-link" href="#tracking">
                        Orders
                      </a>
                    </li>

                    <li className="nav-item">
                      <button
                        className="btn btn-outline-danger rounded-pill"
                        onClick={() => setShowNotifications(!showNotifications)}
                      >
                        🔔
                        {notifications.length > 0 && (
                          <span className="badge bg-danger ms-1">
                            {notifications.length}
                          </span>
                        )}
                      </button>
                    </li>

                    <li className="nav-item">
                      <button
                        className="btn btn-dark rounded-pill"
                        onClick={() => setAdmin(!admin)}
                      >
                        ⚙️ {admin ? "Customer" : "Admin"}
                      </button>
                    </li>

                    <li className="nav-item">
                      <button
                        className="btn btn-outline-dark rounded-circle"
                        onClick={() => setDark(!dark)}
                      >
                        {dark ? "☀️" : "🌙"}
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
            </nav>

            {/* NOTIFICATIONS */}

            {showNotifications && (
              <div
                className="position-fixed glass p-3 rounded-4 shadow"
                style={{
                  right: 20,
                  top: 80,
                  width: "320px",
                  zIndex: 3000,
                }}
              >
                <div className="d-flex justify-content-between">
                  <h5 className="fw-bold">Notifications</h5>

                  <button
                    className="btn-close"
                    onClick={() => setShowNotifications(false)}
                  ></button>
                </div>

                <hr />

                {notifications.length === 0 ? (
                  <p className="text-secondary">No notifications</p>
                ) : (
                  notifications.map((n) => (
                    <div className="small mb-3" key={n.id}>
                      <strong>{n.message}</strong>
                      <br />
                      <span className="text-secondary">{n.time}</span>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* HERO */}

            <section id="home" className="hero">
              <div className="container">
                <div className="row align-items-center">
                  <div className="col-lg-7">
                    <span className="badge-live">
                      <span className="status-dot"></span>
                      &nbsp; STORE LIVE NOW
                    </span>

                    <h1 className="hero-title mt-4">
                      Your journey
                      <br />
                      to <span className="gradient-text">happiness.</span>
                    </h1>

                    <p className="lead text-secondary mt-4">
                      Travel from home to FrostBite, discover live flavours, get
                      AI recommendations, order your favourite ice cream and
                      track everything in real time.
                    </p>

                    <div className="d-flex flex-wrap gap-3 mt-4">
                      <button
                        className="btn btn-danger btn-lg rounded-pill px-4"
                        onClick={startJourney}
                      >
                        <i className="bi bi-geo-alt"></i>
                        &nbsp; Start My Journey
                      </button>

                      <a
                        href="#menu"
                        className="btn btn-outline-dark btn-lg rounded-pill px-4"
                      >
                        Explore Menu
                      </a>
                    </div>

                    <div className="row mt-5">
                      <div className="col-4">
                        <strong className="fs-3">4.9★</strong>
                        <small className="d-block text-secondary">
                          Customer Rating
                        </small>
                      </div>

                      <div className="col-4">
                        <strong className="fs-3">20+</strong>
                        <small className="d-block text-secondary">
                          Flavours
                        </small>
                      </div>

                      <div className="col-4">
                        <strong className="fs-3">15m</strong>
                        <small className="d-block text-secondary">
                          Avg Pickup
                        </small>
                      </div>
                    </div>
                  </div>

                  <div className="col-lg-5">
                    <div className="hero-card">
                      <div className="hero-ice">🍨</div>

                      <h3 className="text-center fw-bold">Scoop Happiness</h3>

                      <p className="text-center text-secondary">
                        Fresh • Premium • Delicious
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* QUICK FEATURES */}

            <section className="section">
              <div className="container">
                <div className="row g-4">
                  {[
                    ["📍", "Live GPS", "Track your journey to the shop."],
                    ["🤖", "AI Suggestions", "Find the perfect flavour."],
                    ["⚡", "Live Menu", "Real-time availability."],
                    ["📦", "Live Tracking", "Track your order status."],
                  ].map((x) => (
                    <div className="col-md-6 col-lg-3" key={x[1]}>
                      <div className="feature-card p-4 h-100">
                        <div className="fs-1">{x[0]}</div>

                        <h5 className="fw-bold mt-3">{x[1]}</h5>

                        <p className="text-secondary mb-0">{x[2]}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* JOURNEY */}

            <section id="journey" className="section">
              <div className="container">
                <div className="text-center mb-5">
                  <span className="text-danger fw-bold">MOVEMENT ENGINE</span>

                  <h2 className="display-5 fw-bold">Home → FrostBite</h2>

                  <p className="text-secondary">
                    Live movement and navigation experience.
                  </p>
                </div>

                <div className="row g-4">
                  <div className="col-lg-8">
                    <div id="map" ref={mapRef}></div>
                  </div>

                  <div className="col-lg-4">
                    <div className="glass rounded-4 p-4 h-100">
                      <div className="d-flex justify-content-between">
                        <div>
                          <small className="text-secondary">STATUS</small>

                          <h4 className="fw-bold">
                            {!journey
                              ? "Ready to Start"
                              : movement >= 100
                                ? "Arrived 🎉"
                                : "Travelling..."}
                          </h4>
                        </div>

                        <div className="fs-2">
                          {travelMode === "walking"
                            ? "🚶"
                            : travelMode === "cycling"
                              ? "🚲"
                              : "🚗"}
                        </div>
                      </div>

                      <hr />

                      <label className="fw-bold">Travel Mode</label>

                      <select
                        className="form-select rounded-pill mt-2"
                        value={travelMode}
                        onChange={(e) => setTravelMode(e.target.value)}
                      >
                        <option value="walking">🚶 Walking</option>
                        <option value="cycling">🚲 Cycling</option>
                        <option value="driving">🚗 Driving</option>
                      </select>

                      <div className="mt-4">
                        <div className="d-flex justify-content-between">
                          <span>Movement</span>

                          <strong>{movement}%</strong>
                        </div>

                        <div className="movement-bar mt-2">
                          <div
                            className="movement-progress"
                            style={{ width: movement + "%" }}
                          />
                        </div>
                      </div>

                      <div className="row mt-4">
                        <div className="col-6">
                          <small className="text-secondary">Distance</small>

                          <h5 className="fw-bold">{distance.toFixed(1)} km</h5>
                        </div>

                        <div className="col-6">
                          <small className="text-secondary">ETA</small>

                          <h5 className="fw-bold">{eta} min</h5>
                        </div>
                      </div>

                      <div className="mt-3">
                        <div className="d-flex justify-content-between">
                          <span>🏠 Home</span>
                          <span>📍 Shop</span>
                        </div>
                      </div>

                      {!journey && (
                        <button
                          className="btn btn-danger w-100 rounded-pill mt-4"
                          onClick={startJourney}
                        >
                          Start Live Journey
                        </button>
                      )}

                      {journey && movement < 100 && (
                        <div className="alert alert-info mt-4 mb-0">
                          <i className="bi bi-broadcast"></i>
                          &nbsp; Live movement simulation active
                        </div>
                      )}

                      {movement >= 100 && (
                        <div className="alert alert-success mt-4">
                          🎉 You have reached FrostBite!
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* AI */}

            <section className="section bg-light">
              <div className="container">
                <div className="ai-box p-4 p-lg-5">
                  <div className="row align-items-center">
                    <div className="col-lg-7">
                      <span className="text-danger fw-bold">
                        🤖 FROSTBITE AI
                      </span>

                      <h2 className="display-6 fw-bold mt-2">
                        Not sure what to choose?
                      </h2>

                      <p className="text-secondary">
                        Tell FrostBite what you want and get a smart flavour
                        recommendation.
                      </p>

                      <div className="d-flex flex-wrap gap-2">
                        <button
                          className="btn btn-dark rounded-pill"
                          onClick={() => aiRecommend("chocolate")}
                        >
                          🍫 Chocolate
                        </button>

                        <button
                          className="btn btn-dark rounded-pill"
                          onClick={() => aiRecommend("fruit")}
                        >
                          🍓 Fruity
                        </button>

                        <button
                          className="btn btn-dark rounded-pill"
                          onClick={() => aiRecommend("budget")}
                        >
                          💰 Under ₹150
                        </button>

                        <button
                          className="btn btn-dark rounded-pill"
                          onClick={() => aiRecommend("best")}
                        >
                          ⭐ Best Rated
                        </button>

                        <button
                          className="btn btn-dark rounded-pill"
                          onClick={() => aiRecommend("new")}
                        >
                          🆕 New
                        </button>
                      </div>
                    </div>

                    <div className="col-lg-5 mt-4 mt-lg-0">
                      <div className="glass rounded-4 p-4">
                        <div className="fs-1">🤖🍦</div>

                        <small className="text-secondary">AI RECOMMENDS</small>

                        <h3 className="fw-bold">{recommendation}</h3>

                        <button
                          className="btn btn-danger rounded-pill"
                          onClick={() => {
                            const item = menu.find(
                              (x) => x.name === recommendation,
                            );
                            if (item) addToCart(item);
                          }}
                        >
                          Add Recommendation
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* MENU */}

            <section id="menu" className="section">
              <div className="container">
                <div className="text-center mb-5">
                  <span className="text-danger fw-bold">LIVE MENU</span>

                  <h2 className="display-5 fw-bold">Choose your flavour</h2>

                  <p className="text-secondary">
                    Menu availability updates instantly.
                  </p>
                </div>

                <div className="row justify-content-center mb-4">
                  <div className="col-lg-6">
                    <div className="input-group">
                      <span className="input-group-text bg-white">🔍</span>

                      <input
                        className="form-control"
                        placeholder="Search ice cream..."
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                      />
                    </div>
                  </div>
                </div>

                <div className="d-flex flex-wrap justify-content-center gap-2 mb-5">
                  {["All", "Classic", "Chocolate", "Fruit", "Special"].map(
                    (c) => (
                      <button
                        key={c}
                        className={
                          category === c
                            ? "category-btn active"
                            : "category-btn"
                        }
                        onClick={() => setCategory(c)}
                      >
                        {c}
                      </button>
                    ),
                  )}
                </div>

                {/* TRENDING */}

                <div className="mb-5">
                  <h4 className="fw-bold mb-3">🔥 Trending Now</h4>

                  <div className="row g-3">
                    {[...menu]
                      .sort((a, b) => b.rating - a.rating)
                      .slice(0, 4)
                      .map((item) => (
                        <div className="col-6 col-lg-3" key={item.id}>
                          <div
                            className="shop-card p-3"
                            style={{ cursor: "pointer" }}
                            onClick={() => {
                              setCategory(item.category);
                              setSearch(item.name);
                            }}
                          >
                            <div className="fs-1">{item.emoji}</div>

                            <strong>{item.name}</strong>

                            <div className="text-warning">★ {item.rating}</div>
                          </div>
                        </div>
                      ))}
                  </div>
                </div>

                <div className="row g-4">
                  {filtered.length === 0 ? (
                    <div className="empty">
                      <div className="display-3">🍨</div>
                      <h4>No flavours found</h4>
                      <p>Try another search or category.</p>
                    </div>
                  ) : (
                    filtered.map((item) => (
                      <div className="col-sm-6 col-lg-3" key={item.id}>
                        <div className="menu-card h-100">
                          <div className="menu-image">
                            <div>
                              {item.emoji}

                              <div
                                className="favorite text-center"
                                onClick={() => toggleFavorite(item.id)}
                              >
                                {favorites.includes(item.id) ? "❤️" : "♡"}
                              </div>
                            </div>
                          </div>

                          <div className="p-4">
                            <div className="d-flex justify-content-between">
                              <h5 className="fw-bold">{item.name}</h5>

                              <span className="text-warning">
                                ★ {item.rating}
                              </span>
                            </div>

                            <p className="small text-secondary">
                              {item.description}
                            </p>

                            <div className="d-flex gap-1 flex-wrap">
                              {item.newItem && (
                                <span className="badge bg-success">NEW</span>
                              )}

                              {item.seasonal && (
                                <span className="badge bg-warning text-dark">
                                  SEASONAL
                                </span>
                              )}
                            </div>

                            <div className="d-flex justify-content-between align-items-center mt-3">
                              <strong className="fs-5">₹{item.price}</strong>

                              <button
                                className="btn btn-danger rounded-pill"
                                onClick={() => {
                                  setSelected(item);
                                  setCustomSize("Regular");
                                  setTopping("None");
                                  setCustomQty(1);
                                  setCustomOpen(true);
                                }}
                              >
                                Customize
                              </button>
                            </div>

                            <small className="text-secondary">
                              {item.stock} available
                            </small>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </section>

            {/* FAVORITES */}

            <section className="section bg-light">
              <div className="container">
                <div className="d-flex justify-content-between align-items-center mb-4">
                  <div>
                    <span className="text-danger fw-bold">YOUR PICKS</span>
                    <h2 className="fw-bold">❤️ Favourite Flavours</h2>
                  </div>
                </div>

                <div className="row g-4">
                  {menu.filter((x) => favorites.includes(x.id)).length === 0 ? (
                    <div className="empty">
                      <div className="display-4">❤️</div>
                      <p>Tap the heart on any ice cream to save it.</p>
                    </div>
                  ) : (
                    menu
                      .filter((x) => favorites.includes(x.id))
                      .map((item) => (
                        <div className="col-sm-6 col-lg-3" key={item.id}>
                          <div className="menu-card p-4">
                            <div className="fs-1">{item.emoji}</div>

                            <h5 className="fw-bold">{item.name}</h5>

                            <p className="text-secondary">₹{item.price}</p>

                            <button
                              className="btn btn-danger rounded-pill"
                              onClick={() => addToCart(item)}
                            >
                              Add to Cart
                            </button>
                          </div>
                        </div>
                      ))
                  )}
                </div>
              </div>
            </section>

            {/* ADMIN */}

            {admin && (
              <section className="section">
                <div className="container">
                  <div className="admin p-4 p-lg-5">
                    <div className="d-flex flex-wrap justify-content-between align-items-center mb-4">
                      <div>
                        <span className="text-danger fw-bold">SHOP ADMIN</span>

                        <h2 className="fw-bold">FrostBite Control Center</h2>
                      </div>

                      <span className="badge bg-success">● LIVE</span>
                    </div>

                    <div className="d-flex flex-wrap gap-2 mb-4">
                      {["menu", "analytics"].map((tab) => (
                        <button
                          className={
                            adminTab === tab
                              ? "btn btn-danger rounded-pill"
                              : "btn btn-outline-light rounded-pill"
                          }
                          onClick={() => setAdminTab(tab)}
                          key={tab}
                        >
                          {tab === "menu"
                            ? "🍦 Menu Management"
                            : "📊 Analytics"}
                        </button>
                      ))}
                    </div>

                    {adminTab === "menu" && (
                      <>
                        <h5 className="fw-bold">Add New Flavour</h5>

                        <div className="row g-2 mb-5">
                          <div className="col-md-3">
                            <input
                              id="aName"
                              className="form-control"
                              placeholder="Flavour name"
                            />
                          </div>

                          <div className="col-md-2">
                            <input
                              id="aPrice"
                              type="number"
                              className="form-control"
                              placeholder="Price"
                            />
                          </div>

                          <div className="col-md-2">
                            <input
                              id="aEmoji"
                              className="form-control"
                              placeholder="🍦"
                            />
                          </div>

                          <div className="col-md-2">
                            <select id="aCat" className="form-select">
                              <option>Classic</option>
                              <option>Chocolate</option>
                              <option>Fruit</option>
                              <option>Special</option>
                            </select>
                          </div>

                          <div className="col-md-2">
                            <input
                              id="aStock"
                              type="number"
                              className="form-control"
                              placeholder="Stock"
                            />
                          </div>

                          <div className="col-md-1">
                            <button
                              className="btn btn-danger w-100"
                              onClick={addItem}
                            >
                              +
                            </button>
                          </div>
                        </div>

                        <div className="table-responsive">
                          <table className="table table-dark align-middle">
                            <thead>
                              <tr>
                                <th>Flavour</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Action</th>
                              </tr>
                            </thead>

                            <tbody>
                              {menu.map((item) => (
                                <tr key={item.id}>
                                  <td>
                                    {item.emoji} {item.name}
                                  </td>

                                  <td>{item.category}</td>

                                  <td>₹{item.price}</td>

                                  <td>{item.stock}</td>

                                  <td>
                                    <button
                                      className={
                                        item.stock > 0
                                          ? "btn btn-success btn-sm"
                                          : "btn btn-secondary btn-sm"
                                      }
                                      onClick={() => toggleStock(item.id)}
                                    >
                                      {item.stock > 0
                                        ? "Available"
                                        : "Sold Out"}
                                    </button>
                                  </td>

                                  <td>
                                    <button
                                      className="btn btn-outline-danger btn-sm"
                                      onClick={() => deleteItem(item.id)}
                                    >
                                      <i className="bi bi-trash"></i>
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </>
                    )}

                    {adminTab === "analytics" && (
                      <>
                        <div className="row g-4">
                          <div className="col-md-3">
                            <div className="stat">
                              <small className="text-secondary">
                                TOTAL ORDERS
                              </small>

                              <h2 className="fw-bold">{orders.length}</h2>
                            </div>
                          </div>

                          <div className="col-md-3">
                            <div className="stat">
                              <small className="text-secondary">REVENUE</small>

                              <h2 className="fw-bold">₹{revenue}</h2>
                            </div>
                          </div>

                          <div className="col-md-3">
                            <div className="stat">
                              <small className="text-secondary">
                                ITEMS SOLD
                              </small>

                              <h2 className="fw-bold">{soldItems}</h2>
                            </div>
                          </div>

                          <div className="col-md-3">
                            <div className="stat">
                              <small className="text-secondary">
                                BEST SELLER
                              </small>

                              <h5 className="fw-bold mt-2">{bestName}</h5>
                            </div>
                          </div>
                        </div>

                        <div className="glass text-dark rounded-4 p-4 mt-4">
                          <h5 className="fw-bold">📊 Sales Overview</h5>

                          {Object.keys(bestSeller).length === 0 ? (
                            <p className="text-secondary">No sales data yet.</p>
                          ) : (
                            Object.entries(bestSeller).map(([name, count]) => (
                              <div key={name} className="mb-3">
                                <div className="d-flex justify-content-between">
                                  <strong>{name}</strong>
                                  <span>{count} sold</span>
                                </div>

                                <div className="progress">
                                  <div
                                    className="progress-bar bg-danger"
                                    style={{
                                      width: Math.min(100, count * 10) + "%",
                                    }}
                                  ></div>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </>
                    )}
                  </div>
                </div>
              </section>
            )}

            {/* ORDER TRACKING */}

            <section id="tracking" className="section">
              <div className="container">
                <div className="text-center mb-5">
                  <span className="text-danger fw-bold">ORDER CENTER</span>

                  <h2 className="display-5 fw-bold">Live Order Tracking</h2>
                </div>

                {!order ? (
                  <div className="glass rounded-4 p-5 text-center">
                    <div className="display-1">📦</div>

                    <h3 className="fw-bold">No active order</h3>

                    <p className="text-secondary">
                      Your placed orders will appear here.
                    </p>

                    <a href="#menu" className="btn btn-danger rounded-pill">
                      Order Ice Cream
                    </a>
                  </div>
                ) : (
                  <div className="row justify-content-center">
                    <div className="col-lg-8">
                      <div className="glass rounded-4 p-5">
                        <div className="d-flex justify-content-between">
                          <div>
                            <small className="text-secondary">ORDER ID</small>

                            <h3 className="fw-bold">#{order.id}</h3>
                          </div>

                          <span className="badge bg-success align-self-start">
                            LIVE
                          </span>
                        </div>

                        <hr />

                        <div className="timeline">
                          {[
                            "Order Confirmed",
                            "Preparing",
                            "Scooping",
                            "Packed",
                            "Ready for Pickup",
                          ].map((status, i) => {
                            const statuses = [
                              "Order Confirmed",
                              "Preparing",
                              "Scooping",
                              "Packed",
                              "Ready for Pickup",
                            ];

                            const active =
                              statuses.indexOf(status) <=
                              statuses.indexOf(orderStatus);

                            return (
                              <div className="timeline-item" key={status}>
                                <h6
                                  className={
                                    active ? "fw-bold" : "text-secondary"
                                  }
                                >
                                  {active ? "✓ " : "○ "}
                                  {status}
                                </h6>

                                {status === orderStatus && (
                                  <span className="text-danger small">
                                    Currently processing...
                                  </span>
                                )}
                              </div>
                            );
                          })}
                        </div>

                        <hr />

                        <div className="row">
                          <div className="col-6">
                            <small className="text-secondary">Payment</small>

                            <strong className="d-block">{order.payment}</strong>
                          </div>

                          <div className="col-6 text-end">
                            <small className="text-secondary">Total</small>

                            <strong className="d-block">₹{order.total}</strong>
                          </div>
                        </div>

                        <button
                          className="btn btn-dark rounded-pill mt-4"
                          onClick={() => setShowReceipt(true)}
                        >
                          🧾 View Receipt
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </section>

            {/* ORDER HISTORY */}

            <section className="section bg-light">
              <div className="container">
                <div className="text-center mb-5">
                  <h2 className="fw-bold">📜 Order History</h2>

                  <p className="text-secondary">
                    Your previous FrostBite orders.
                  </p>
                </div>

                {orders.length === 0 ? (
                  <div className="empty">No previous orders.</div>
                ) : (
                  <div className="row g-3">
                    {orders.map((o) => (
                      <div className="col-lg-6" key={o.id}>
                        <div className="glass rounded-4 p-4">
                          <div className="d-flex justify-content-between">
                            <strong>#{o.id}</strong>

                            <span className="badge bg-success">{o.status}</span>
                          </div>

                          <p className="text-secondary small mt-2">{o.date}</p>

                          {(o.items || []).map((x, i) => (
                            <div
                              className="d-flex justify-content-between"
                              key={i}
                            >
                              <span>
                                {x.emoji} {x.name} × {x.qty}
                              </span>

                              <strong>₹{x.price * x.qty}</strong>
                            </div>
                          ))}

                          <hr />

                          <div className="d-flex justify-content-between">
                            <strong>Total</strong>

                            <strong>₹{o.total}</strong>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </section>

            {/* REVIEW */}

            {order && (
              <section className="section">
                <div className="container">
                  <div className="row justify-content-center">
                    <div className="col-lg-7">
                      <div className="glass rounded-4 p-5 text-center">
                        <div className="display-4">⭐</div>

                        <h3 className="fw-bold">How was your FrostBite?</h3>

                        <div className="my-3">
                          {[1, 2, 3, 4, 5].map((n) => (
                            <button
                              key={n}
                              className="btn btn-link fs-2"
                              onClick={() => setReview(n)}
                            >
                              {n <= review ? "⭐" : "☆"}
                            </button>
                          ))}
                        </div>

                        <textarea
                          className="form-control"
                          rows="3"
                          placeholder="Tell us about your experience..."
                          value={reviewText}
                          onChange={(e) => setReviewText(e.target.value)}
                        ></textarea>

                        <button
                          className="btn btn-danger rounded-pill mt-3 px-4"
                          onClick={() => {
                            if (!review) {
                              notify("Please select a rating.");
                              return;
                            }
                            notify("Thank you for your review! ⭐");
                            setReviewText("");
                          }}
                        >
                          Submit Review
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* CART */}

            {cartCount > 0 && (
              <button
                className="floating-cart"
                onClick={() => setShowCart(!showCart)}
              >
                <i className="bi bi-cart3 fs-4"></i>
                <span className="cart-count">{cartCount}</span>
              </button>
            )}

            <div
              className={
                showCart ? "cart-panel glass p-4 show" : "cart-panel glass p-4"
              }
            >
              <div className="d-flex justify-content-between">
                <h4 className="fw-bold">🛒 Your Cart</h4>

                <button
                  className="btn-close"
                  onClick={() => setShowCart(false)}
                ></button>
              </div>

              <hr />

              {cart.map((item, index) => (
                <div className="mb-4" key={index}>
                  <div className="d-flex gap-3">
                    <div className="fs-2">{item.emoji}</div>

                    <div className="flex-grow-1">
                      <strong>{item.name}</strong>

                      <div className="small text-secondary">
                        {item.size} • {item.topping}
                      </div>

                      <div>₹{item.price + item.extra}</div>
                    </div>

                    <div className="btn-group align-self-center">
                      <button
                        className="btn btn-sm btn-outline-secondary"
                        onClick={() => changeQty(index, -1)}
                      >
                        −
                      </button>

                      <span className="btn btn-sm btn-outline-secondary">
                        {item.qty}
                      </span>

                      <button
                        className="btn btn-sm btn-outline-secondary"
                        onClick={() => changeQty(index, 1)}
                      >
                        +
                      </button>
                    </div>
                  </div>
                </div>
              ))}

              <hr />

              <div className="input-group mb-2">
                <input
                  className="form-control"
                  placeholder="Coupon code"
                  value={coupon}
                  onChange={(e) => setCoupon(e.target.value)}
                />

                <button className="btn btn-dark" onClick={applyCoupon}>
                  Apply
                </button>
              </div>

              <small className="text-secondary">
                Try FROST10, SWEET50 or WELCOME
              </small>

              <div className="mt-3">
                <div className="d-flex justify-content-between">
                  <span>Subtotal</span>
                  <strong>₹{subtotal}</strong>
                </div>

                <div className="d-flex justify-content-between">
                  <span>Tax</span>
                  <strong>₹{tax}</strong>
                </div>

                <div className="d-flex justify-content-between">
                  <span>Discount</span>
                  <strong className="text-success">− ₹{discount}</strong>
                </div>

                <hr />

                <div className="d-flex justify-content-between fs-5">
                  <strong>Total</strong>
                  <strong>₹{total}</strong>
                </div>
              </div>

              <button
                className="btn btn-danger w-100 rounded-pill mt-4"
                onClick={() => setShowPayment(true)}
              >
                Continue to Payment
              </button>
            </div>

            {/* CUSTOMIZE MODAL */}

            {customOpen && selected && (
              <div
                className="modal d-block"
                style={{
                  background: "#0009",
                  zIndex: 5000,
                }}
              >
                <div className="modal-dialog modal-dialog-centered">
                  <div className="modal-content rounded-4">
                    <div className="modal-header">
                      <h5 className="fw-bold">Customize {selected.emoji}</h5>

                      <button
                        className="btn-close"
                        onClick={() => setCustomOpen(false)}
                      ></button>
                    </div>

                    <div className="modal-body">
                      <div className="text-center display-2">
                        {selected.emoji}
                      </div>

                      <h4 className="text-center fw-bold">{selected.name}</h4>

                      <hr />

                      <label className="fw-bold">Size</label>

                      <div className="d-flex gap-2 mt-2 mb-4">
                        {[
                          ["Small", 0],
                          ["Regular", 20],
                          ["Large", 40],
                        ].map((x) => (
                          <button
                            key={x[0]}
                            className={
                              customSize === x[0]
                                ? "btn btn-danger"
                                : "btn btn-outline-secondary"
                            }
                            onClick={() => setCustomSize(x[0])}
                          >
                            {x[0]} +₹{x[1]}
                          </button>
                        ))}
                      </div>

                      <label className="fw-bold">Topping</label>

                      <select
                        className="form-select mt-2"
                        value={topping}
                        onChange={(e) => setTopping(e.target.value)}
                      >
                        <option>None</option>
                        <option>Chocolate Chips</option>
                        <option>Sprinkles</option>
                        <option>Caramel</option>
                        <option>Oreo Crumbs</option>
                        <option>Nuts</option>
                      </select>

                      <label className="fw-bold mt-4">Quantity</label>

                      <div className="input-group mt-2">
                        <button
                          className="btn btn-outline-secondary"
                          onClick={() =>
